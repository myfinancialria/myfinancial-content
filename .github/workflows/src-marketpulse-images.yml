name: "[Market Pulse] Pre/Post-market image + deploy (manual)"

# Pre/post-market BRIEFS are published as articles by the content repo's own
# generate_premarket / generate_postmarket workflows. These are the branded
# INFOGRAPHIC variants (Telegram), kept manual; running one also archives a
# Market Pulse page and redeploys the site.

on:
  workflow_dispatch:
    inputs:
      which:
        description: "Which infographic to run"
        type: choice
        required: true
        default: premarket
        options: [premarket, postmarket]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: sources/market-pulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fyers daily login
        env:
          FYERS_CLIENT_ID: ${{ secrets.FYERS_CLIENT_ID }}
          FYERS_SECRET: ${{ secrets.FYERS_SECRET }}
          FYERS_REDIRECT: ${{ secrets.FYERS_REDIRECT }}
          FYERS_FY_ID: ${{ secrets.FYERS_FY_ID }}
          FYERS_PIN: ${{ secrets.FYERS_PIN }}
          FYERS_TOTP_KEY: ${{ secrets.FYERS_TOTP_KEY }}
        run: python auto_login.py

      - name: Run ${{ github.event.inputs.which }} (Telegram + archive page)
        env:
          FYERS_CLIENT_ID: ${{ secrets.FYERS_CLIENT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PULSE_CHAT_ID: ${{ secrets.TELEGRAM_PULSE_CHAT_ID }}
        run: python ${{ github.event.inputs.which }}.py

      - name: Commit archived page + hero
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in articles output; do [ -d "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "market-pulse ${{ github.event.inputs.which }}: $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do git pull --rebase --no-edit && git push && break; sleep $((10 * i)); done
          fi

      - name: Build unified tabbed site (all sources)
        working-directory: ${{ github.workspace }}
        run: python site_build.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
