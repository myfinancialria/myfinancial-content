name: Generate today's articles (5 categories)

on:
  schedule:
    - cron: "0 0 * * *"   # 05:30 IST
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Scrape sources
        env:
          CONTENT_FEEDS: ${{ secrets.CONTENT_FEEDS }}
        run: python scrape_sources.py

      - name: Categorize scraped articles
        run: python categorize.py

      - name: Pick + write article for each category
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARTICLE_SYSTEM_PROMPT: ${{ secrets.ARTICLE_SYSTEM_PROMPT }}
        run: |
          for cat in pre_market post_market result_analysis macro personal_finance; do
            echo "=== Category: $cat ==="
            if CATEGORY=$cat python pick_topic.py; then
              CATEGORY=$cat python write_article.py || echo "write failed for $cat"
            else
              echo "no topic for $cat — skipping"
            fi
          done

      - name: Generate hero images
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for cat in pre_market post_market result_analysis macro personal_finance; do
            CATEGORY=$cat python generate_image.py || echo "image failed for $cat"
          done

      - name: Fact-check each article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for cat in pre_market post_market result_analysis macro personal_finance; do
            CATEGORY=$cat python fact_check.py || echo "fact-check failed for $cat"
          done

      - name: Slack alerts (per-category rewrite/review)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CONTENT_CHANNEL: ${{ secrets.SLACK_CONTENT_CHANNEL }}
          SLACK_CONTENT_WEBHOOK_URL: ${{ secrets.SLACK_CONTENT_WEBHOOK_URL }}
        run: |
          for cat in pre_market post_market result_analysis macro personal_finance; do
            CATEGORY=$cat python slack_alert.py || true
          done

      - name: Render HTML + sitemap
        run: python publish.py

      - name: Commit data + articles + output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ articles/ output/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "content: articles for $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Ping IndexNow
        run: python indexnow_ping.py || echo "IndexNow ping failed, continuing"
