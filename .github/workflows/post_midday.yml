name: Personal-finance articles to Slack (12:00 IST)

on:
  schedule:
    - cron: "30 6 * * *"   # 12:00 IST daily
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      # Push the 3 personal-finance-flavoured articles (personal_finance, macro, result_analysis) to Slack ONLY
      - name: Post macro + personal_finance + result_analysis to Slack
        env:
          SLOT: midday
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CONTENT_CHANNEL: ${{ secrets.SLACK_CONTENT_CHANNEL }}
          SLACK_CONTENT_WEBHOOK_URL: ${{ secrets.SLACK_CONTENT_WEBHOOK_URL }}
        run: |
          for cat in personal_finance macro result_analysis; do
            CATEGORY=$cat python slack_post.py || true
            sleep 2
          done
