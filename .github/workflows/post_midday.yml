name: Post — midday (1 PM IST)

on:
  schedule:
    - cron: "30 7 * * *"   # 13:00 IST
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      # Midday slot covers macro + personal_finance (lunch-read material)
      - name: Post macro + personal_finance
        env:
          SLOT: midday
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CONTENT_CHANNEL: ${{ secrets.SLACK_CONTENT_CHANNEL }}
          SLACK_CONTENT_WEBHOOK_URL: ${{ secrets.SLACK_CONTENT_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for cat in macro personal_finance; do
            CATEGORY=$cat python slack_post.py || true
            CATEGORY=$cat python telegram_post.py || true
            sleep 2
          done
